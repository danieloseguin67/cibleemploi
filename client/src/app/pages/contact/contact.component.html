<ng-container *ngIf="content() as page">
  <h1>{{ page.title }}</h1>

  <div class="contact-grid">
    <div class="contact-info">
      <h2>{{ page.orgName }}</h2>
      <p *ngFor="let line of page.addressLines">{{ line }}</p>
      <p>{{ page.phoneLabel }}</p>
      <p><a href="mailto:info@cibleretour.com">{{ page.emailLabel }}</a></p>

      <h3>{{ page.hoursTitle }}</h3>
      <ul>
        <li *ngFor="let entry of page.hours"><strong>{{ entry.day }}</strong> : {{ entry.time }}</li>
      </ul>
    </div>

    <div class="contact-form-wrapper">
      <p>{{ page.form.mailInstructions }}</p>
      <div class="success-banner" role="status" *ngIf="mailRequested()">{{ page.form.mailNotice }}</div>
      <button class="confirm-email" type="button" *ngIf="mailRequested()" (click)="confirmEmailSent()">
        {{ page.form.confirmSentLabel }}
      </button>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="contact-form">
        <label>
          {{ page.form.nameLabel }}
          <input type="text" formControlName="name" />
          <span class="error" *ngIf="form.controls.name.touched && form.controls.name.invalid">{{ ui()?.common?.requiredField }}</span>
        </label>
        <label>
          {{ page.form.emailLabel }}
          <input type="email" formControlName="email" />
          <span class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">{{ ui()?.common?.invalidEmail }}</span>
        </label>
        <label>
          {{ page.form.subjectLabel }}
          <input type="text" formControlName="subject" />
          <span class="error" *ngIf="form.controls.subject.touched && form.controls.subject.invalid">{{ ui()?.common?.requiredField }}</span>
        </label>
        <label>
          {{ page.form.messageLabel }}
          <textarea rows="5" formControlName="message"></textarea>
          <span class="error" *ngIf="form.controls.message.touched && form.controls.message.invalid">{{ ui()?.common?.requiredField }}</span>
        </label>
        <button type="submit">{{ page.form.submitLabel }}</button>
      </form>
    </div>
  </div>
</ng-container>
