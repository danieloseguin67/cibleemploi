<ng-container *ngIf="content() as page">
  <h1>{{ page.title }}</h1>
  <div class="team-grid">
    <article class="member-card" *ngFor="let member of page.members">
      <img
        *ngIf="member.image"
        class="member-photo"
        [src]="member.image"
        [alt]="member.name"
        width="240"
        height="240"
        loading="lazy"
        decoding="async"
      />
      <h2>{{ member.name }}</h2>
      <p class="role">{{ member.role }}</p>
      <p class="quote" *ngFor="let line of member.quote.split('\n\n')">{{ line }}</p>
      <p class="attribution" *ngIf="member.attribution">— {{ member.attribution }}</p>
    </article>
  </div>
</ng-container>
