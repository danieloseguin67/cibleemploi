<header class="site-header" *ngIf="ui() as strings">
  <div class="topbar">
    <a class="brand" [routerLink]="'' | localePath" (click)="closeMenu()">
      <img class="brand-logo" src="assets/images/logo-cible-retour-a-emploi.png" alt="Cible Retour à l'Emploi" />
      <span class="brand-text">
        <span class="brand-title">Cible Retour à l'Emploi</span>
        <span class="brand-tagline">{{ strings.tagline }}</span>
      </span>
    </a>
    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav class="main-nav" [class.open]="menuOpen">
    <ul>
      <li *ngFor="let link of strings.nav" class="nav-item" [class.has-children]="link.children?.length">
        <a
          *ngIf="!link.externalUrl"
          [routerLink]="link.path | localePath"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '' }"
          (click)="closeMenu()"
        >{{ link.label }}</a>
        <a *ngIf="link.externalUrl" [href]="link.externalUrl" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
        <ul class="submenu" *ngIf="link.children?.length">
          <li *ngFor="let child of link.children">
            <a [routerLink]="child.path | localePath" routerLinkActive="active" (click)="closeMenu()">{{ child.label }}</a>
          </li>
        </ul>
      </li>
      <li class="nav-item lang-switch">
        <a [routerLink]="otherLocaleLink()" (click)="closeMenu()">{{ strings.languageSwitchLabel }}</a>
      </li>
    </ul>
  </nav>
</header>
